name: Cumartesi Story yayınla

on:
  schedule:
    - cron: '0 9 5 9 *'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Elle yayınlamak için YAYINLA yaz'
        required: true
        default: 'HAYIR'

permissions:
  contents: read

concurrency:
  group: fil-lab-cumartesi-story-2026-09-05
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'schedule' || inputs.confirm == 'YAYINLA'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: İçerikleri al
        uses: actions/checkout@v4

      - name: Node.js hazırla
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Story yayınla
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node automation/publish-story.mjs instagram/2026-09-05-cumartesi-notu/YAYIN_PLANI.json
